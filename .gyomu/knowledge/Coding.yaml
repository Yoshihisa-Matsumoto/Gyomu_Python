# yaml-language-server: $schema=../../schemas/Coding.json

display_name: Coding Guideline for Gyomu Python

principles:
  - 型と構造化モデルを通じて、データ構造・エラー・依存関係を明示する。
  - ビジネスロジックは可能な限り純粋関数として実装し、副作用を伴う処理から分離する。
  - パッケージごとに明確な責務を持たせ、依存関係の方向を維持する。
  - Protocol とコンストラクタインジェクションを活用し、依存先を交換可能かつテスト可能にする。
  - 解析・Concept生成・文書生成・AI実行・レンダリングを独立した責務として設計する。
  - Markdownなどの出力形式に依存する前に、構造化された中間表現を経由する。
  - 人とAIの双方が、既存の設計意図を理解し、安全に保守できる構造を優先する。

rules:
  - category: Typing
    rule: 公開APIおよびアプリケーションの主要な処理には、引数と戻り値の型を明示する。
    rationale: インターフェースを明確にし、型検査によって変更の影響を検出するため。

  - category: Typing
    rule: strictなmypy設定に適合する型安全な実装を維持する。
    rationale: 暗黙の型変換や不明確な型に起因する不具合を早期に検出するため。

  - category: Typing
    rule: Anyや型検査の抑制は安易に導入せず、必要な場合は適用範囲と理由を限定する。
    rationale: 型検査による保証を不用意に弱めないため。

  - category: Schema
    rule: JSON、YAML、永続化データ、外部との境界で受け渡す構造化データは、原則としてPydanticモデルなどの明示的なスキーマで定義・検証する。
    rationale: 入出力の契約を明確にし、不正なデータが内部処理へ侵入することを防ぐため。

  - category: Schema
    rule: 内部状態の表現には、用途に応じてdataclassなどの適切なデータ構造を使用する。
    rationale: 外部データの検証モデルと内部実装の状態を区別し、不要な検証や変換を避けるため。

  - category: Schema
    rule: 同じ概念のデータ構造や制約を、複数の場所で重複して定義しない。
    rationale: 情報の不整合を防ぎ、変更箇所を限定するため。

  - category: ErrorHandling
    rule: アプリケーションで想定される失敗は、原則としてreturns.Result、Success、Failureを用いて明示的に表現する。
    rationale: 呼び出し側が失敗の可能性を型と処理フローから把握できるようにするため。

  - category: ErrorHandling
    rule: 例外は、プログラム上の想定される失敗を暗黙に伝える手段として多用せず、例外を利用する場合は境界で適切に処理する。
    rationale: エラー処理の経路を明確にし、予期しない例外と業務上の失敗を区別するため。

  - category: Architecture
    rule: パッケージは明確な責務を持ち、依存関係は原則として上位のワークフローから下位の機能へ向かうように設計する。
    rationale: 各パッケージを独立して利用・変更・テストできるようにするため。

  - category: Architecture
    rule: パッケージ間の循環依存を導入しない。
    rationale: 依存関係を追跡可能にし、変更の波及範囲を抑えるため。

  - category: Architecture
    rule: 他パッケージの実装詳細ではなく、公開APIを通じて連携する。
    rationale: 内部実装の変更が利用側へ波及することを防ぐため。

  - category: Architecture
    rule: Protocolとコンストラクタインジェクションを活用し、外部依存や交換可能な処理の契約を明示する。
    rationale: 実装を差し替えやすくし、単体テストで依存先を制御できるようにするため。

  - category: Architecture
    rule: 将来の利用方法を理由に抽象化を増やすのではなく、現時点で必要な責務と変更点に基づいて設計する。
    rationale: 不必要な複雑さを避け、設計の意図を理解しやすくするため。

  - category: FunctionalDesign
    rule: 副作用を伴わない処理は、可能な限り純粋関数として実装する。
    rationale: 入力と出力の関係を明確にし、テストと再利用を容易にするため。

  - category: FunctionalDesign
    rule: ファイルシステム、外部サービス、LLMなどとの入出力は、ビジネスロジックから分離する。
    rationale: 副作用の発生箇所を明確にし、テスト時に制御可能にするため。

  - category: AI
    rule: AIの出力は信頼できない入力として扱い、利用前にPydanticモデルなどで検証する。
    rationale: 不正な出力が内部状態や後続処理へ伝播することを防ぐため。

  - category: AI
    rule: AIプロバイダー固有のAPIや型への依存は、適切なアダプターやインフラストラクチャの境界に閉じ込める。
    rationale: AIプロバイダーの変更がドメインロジックや上位パッケージへ波及することを防ぐため。

  - category: AI
    rule: AI実行、ルーティング、フォールバック、リトライの責務を区別し、呼び出し側が不要な実装詳細を知る必要のないインターフェースを設計する。
    rationale: AI実行の制御と業務上の処理を分離し、各機能を独立して検証できるようにするため。

  - category: Documentation
    rule: Conceptや解析結果などの構造化データを、ドキュメント生成の入力として利用する。
    rationale: ソースコードから導出した情報と文書の整合性を維持するため。

  - category: Documentation
    rule: 文書の構成・内容・翻訳・レンダリングを、それぞれ独立した責務として扱う。
    rationale: 文書形式や生成方式を変更しても、他の工程への影響を限定するため。

  - category: Documentation
    rule: Markdown文字列を直接組み立てるのではなく、Documentなどの構造化された中間表現を経由する。
    rationale: 文書内容と出力形式を分離し、検証・翻訳・再利用を容易にするため。

  - category: Knowledge
    rule: ソースコードから導出するConceptと、人が管理するKnowledgeを独立した情報源として扱う。
    rationale: 自動生成される事実と、人が判断・管理する設計知識の責務を区別するため。

  - category: Knowledge
    rule: 同じ設計知識を複数の管理場所に重複して定義せず、適切な情報源を参照する。
    rationale: 矛盾する説明や更新漏れを防ぐため。

  - category: Testing
    rule: 外部から観測可能な振る舞いを変更した場合は、対応するテストを追加または更新する。
    rationale: 既存の契約と振る舞いを継続的に保証するため。

  - category: Testing
    rule: 単体テストは可能な限り決定的にし、LLMや外部サービスへの依存を分離する。
    rationale: 環境やサービスの状態による不安定さを避けるため。

  - category: Testing
    rule: ファイルシステムやプロジェクト構造を扱うテストでは、可能な限り実際の一時ディレクトリやフィクスチャを使用し、外部サービスなどの制御が必要な依存のみをモックする。
    rationale: 実際の入出力やファイル構造に対する振る舞いを検証しつつ、テストの再現性を保つため。

  - category: Testing
    rule: 依存先のモックは実際の公開インターフェースに合わせ、内部実装の呼び出し回数や細部だけに過度に依存しない。
    rationale: 実装変更に過剰反応するテストを避け、契約の破壊を検出できるようにするため。

  - category: Dependencies
    rule: 共有可能な処理は既存の適切なパッケージへ集約し、同じロジックを複数のパッケージで重複実装しない。
    rationale: 共通ロジックの一貫性を維持し、修正箇所を限定するため。

  - category: Dependencies
    rule: 新たな依存パッケージを追加する前に、標準ライブラリや既存の依存関係で十分に実現できないか検討する。
    rationale: 依存関係の増加、保守コスト、互換性リスクを抑えるため。

  - category: CodeStyle
    rule: 既存の命名規則、パッケージ構成、コードスタイルに従い、関連する変更の範囲を必要最小限に保つ。
    rationale: リポジトリ全体の一貫性を維持し、レビューと保守を容易にするため。

  - category: CodeStyle
    rule: ruff、mypy、pytestなど、リポジトリで定めた検査・テストを通過する状態を維持する。
    rationale: コード品質と型安全性を継続的に検証するため。

forbidden:
  - パッケージ間の循環依存を導入すること。
  - 他パッケージの内部実装へ直接依存すること。
  - 同一の概念や制約を複数のモデルで重複定義すること。
  - 想定される失敗を、呼び出し側が把握できない暗黙の例外だけで表現すること。
  - AIが生成したデータを検証せずに後続処理へ渡すこと。
  - AIプロバイダー固有のAPIや型を、境界の外へ不必要に漏らすこと。
  - 解析・Concept生成・文書生成・レンダリングの責務を不必要に混在させること。
  - Markdownなどの出力文字列を、構造化モデルを迂回して直接組み立てること。
  - テストで制御可能な依存を無計画に実サービスへ接続すること。
  - 将来の可能性だけを理由に、不必要な抽象化や共通化を導入すること。
