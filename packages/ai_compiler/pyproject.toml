[project]
name = "gyomu-ai-compiler"
dynamic = ["version"]
description = "Gyomu AI Compiler"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gyomu-schema",
    "gyomu-infra",
    "gyomu-ai",
    "returns",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
gyomu-schema = { workspace = true }
gyomu-infra = { workspace = true }
gyomu-ai = { workspace = true }

[tool.hatch.version]
path = "../../version/__about__.py"


