# yaml-language-server: $schema=../../../../schemas/Package.json

display_name: Gyomu Test

mission: |
  Unit Test自動作成・管理関連の処理を行うことを責務とする。
  Gyomu Python に、Unit Test の自動作成・管理を支援する機能を追加する。

  単に LLM でテストコードを生成するのではなく、既存コード、既存テスト、テスト用ヘルパー、プロジェクトの設計知識を分析し、テストの設計・生成・検証・保守を体系的に支援することを目的とする。

  完全自動化を前提とせず、LLM だけでは判断が難しい設計上の選択については Human in the Loop を採用する。
  人間が承認した判断は永続化し、同じ判断を繰り返し求めない仕組みを目指す。

policies:
  - データモデルからヘルパー関数を生成し、既存ヘルパーの所在・利用方法を追跡することで「テスト用データの構築基盤」を作成する。
  - テストの意図、対象の振る舞い、入力条件、期待結果、パラメータ化の判断を管理することで「テスト仕様・テストケースの管理」を実現する
  - Mock、実オブジェクト、fixture、共有データ、外部リソースの扱いを決めることで「テストの依存関係・実行環境の設計」を管理する
  - 対象モデルに対してどのヘルパー、fixture、テストケースが利用できるかをたどることで「テスト設計情報のナビゲーション」を実現する
  - テストコードの生成・修正、実行、品質確認、実装変更時の影響分析を行うことで「テスト実装・検証・保守」を実現する

  - Mock、fixture、パラメータ化などのテスト設計を支援する。
  - pytest、mypy、Ruff による検証を自動化する。
  - テストコードの問題、実装上の問題、環境上の問題を分類する。
  - 制限付きの修復ループを設け、検証結果に基づいてテストコードを修正する。
  - 人間が承認した設計判断を保存し、将来のテスト生成・保守に再利用する。

constraints:
  - LLM にすべてのテスト設計を無条件に任せることはしてはならない。
  - テストを通すことだけを目的に、assertion を弱めたり、テストを削除・skip したりすることはしてはならない。
  - テスト検証で検出した問題に対し、本番コードを自動的に変更することをしてはならない。

non_goals:
  - 既存の Python Analysis、AI Compiler、Infrastructure の機能を重複して実装すること。
  - AIモデルやAI Providerの実装を提供すること。
  - AI実行基盤そのものを提供すること。
  - Pythonソースコードの解析機構そのものを提供すること。

terminology:
  - term: Helper Inventory
    definition: |
      プロジェクトやパッケージにある特定のモデルについて、テストで簡単に作成できるようなヘルパー関数を用意、管理する

rationale:
  - Conceptを構造化された中間表現として保持することで、同じプロジェクト知識を複数のドキュメント生成処理で再利用できる。

usage:
  - situation: ヘルパー関数のInventoryを作成する
    guidance: 対象パッケージから利用できるヘルパー関数のInventoryを作成し、提供する

examples:
  - title: ヘルパー関数の管理
    input: |
      既存のパッケージ情報
    output: |
      ヘルパー関数を作成するべき対象を探し、対象のヘルパー関数を作成したり、そのInventoryを作成する
    explanation: |
      パッケージに関する情報からテストで利用するヘルパー関数を自動で作成・管理を行い、テストの自動化につなげる
