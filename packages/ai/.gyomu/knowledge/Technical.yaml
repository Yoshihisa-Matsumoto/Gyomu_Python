# yaml-language-server: $schema=../../../../schemas/Technical.json

installation:
  - command: uv add gyomu-ai
    description: |
      通常のPythonパッケージと同様にインストールする。
      特別なセットアップは不要。

configuration: []

dependencies:
  - package: pydantic ai
    description: |
      LLM処理全般に利用

  - package: returns
    description: |
      Success / Failure / Result による明示的な成功・失敗表現に利用する。

  - package: gyomu-schema
    description: |
      スキーマ、共通型の置き場として利用

  - package: gyomu-infra
    description: |
      I/Oなどの基盤処理全般に利用

compatibility:
  - name: pydantic ai
    supported: 2.x
    description: |
      Pydantic AI Version 2 を前提として設計されている。

migration: []
