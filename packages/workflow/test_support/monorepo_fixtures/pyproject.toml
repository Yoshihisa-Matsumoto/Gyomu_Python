[project]
name = "test-monorepo"
version = "0.1.0"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.3",
]

[tool.uv.workspace]
members = [
    "packages/project_a",
    "packages/project_b",
    "packages/schema",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["returns.contrib.mypy.returns_plugin"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

[tool.ruff.format]
quote-style = "double"
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"packages/*/test_support/**/*.py" = ["B008","B006"]
