[project]
name = "gyomu-python-analysis"
dynamic = ["version"]
description = "Gyomu Python Analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gyomu-schema",
    "gyomu-infra",
    "returns>=0.29.0",
    "griffelib>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
gyomu-schema = { workspace = true }
gyomu-infra = { workspace = true }


[tool.hatch.version]
path = "../../version/__about__.py"
