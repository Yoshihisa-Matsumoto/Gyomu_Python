# yaml-language-server: $schema=../../../../schemas/Package.json

display_name: Gyomu Infra

mission: |
  Gyomuエコシステムで共通して利用するインフラストラクチャ機能を提供します。
  ファイル操作、設定の読み込み、CSV、アーカイブ、データベースアクセスなど、
  アプリケーションの外部環境との接続に必要な具体的な処理を共通化します。
  外部ライブラリや実行環境に依存する処理をこのパッケージに集約することで、
  上位のパッケージがインフラストラクチャの実装詳細に直接依存しない構成を
  実現します。

policies:
  - 外部環境との入出力や副作用を伴う処理は、共通のインフラストラクチャ機能として集約する。
  - 外部ライブラリの具体的なAPIは、必要に応じてGyomuのインターフェースや共通処理の内側に閉じ込める。
  - ファイルシステム、データベース、設定、データ変換などの機能は、それぞれの責務を明確に分離する。
  - 外部から取得したデータは、必要に応じてSchemaによる検証と組み合わせて扱う。
  - データベースアクセスでは、RepositoryやMapperなどの責務を分離し、永続化の実装詳細を利用側から切り離す。
  - エラーは共通のエラーモデルへ変換し、発生箇所や操作内容を追跡できる情報を保持する。
  - 特定のアプリケーションの業務ロジックやドメイン知識をインフラストラクチャ層へ持ち込まない。
  - インフラストラクチャの実装は、利用側が特定の外部ライブラリへ直接依存する必要がないように設計する。

constraints:
  - 業務ロジックを実装してはならない。
  - 特定アプリケーションのドメインロジックへ依存してはならない。
  - 外部ライブラリ固有の型やAPIをGyomuの共通インターフェースとして不用意に公開してはならない。
  - インフラストラクチャの実装詳細を上位のアプリケーション層へ持ち込んではならない。
  - 外部データを検証せずにアプリケーションの内部モデルとして扱ってはならない。
  - 特定のデータベース製品や外部サービスに依存した業務処理を実装してはならない。

non_goals:
  - アプリケーション固有のビジネスロジックを提供すること。
  - ドメインモデルや業務ルールを定義すること。
  - UIやユーザーインターフェース機能を提供すること。
  - AIの実行やLLMとの通信を担当すること。
  - 特定アプリケーション固有の設定やワークフローを管理すること。
  - 外部ライブラリそのものを再実装すること。

terminology:
  - term: Infrastructure
    definition: ファイルシステム、データベース、設定、外部データなど、アプリケーションの外部環境と接続するための具体的な実装領域。

  - term: Repository
    definition: データの永続化や取得を抽象化し、利用側から永続化の具体的な実装を分離するデータアクセス層。

  - term: Mapper
    definition: 外部データや永続化モデルと、アプリケーションで扱うデータモデルとの変換を担当する層。

  - term: File Operation
    definition: ファイルやディレクトリの読み書き、操作、検索など、ファイルシステムに対する処理。

  - term: Serialization
    definition: アプリケーション内部のデータとJSON、CSVなどの外部データ形式との間で変換する処理。

  - term: Transaction
    definition: 複数のデータベース操作を一つの単位として扱い、トランザクション境界を管理する仕組み。

rationale:
  - インフラストラクチャの実装を集約することで、上位パッケージが外部ライブラリや実行環境の詳細に直接依存することを防げる。
  - ファイル、データベース、設定、データ変換などの共通処理を再利用することで、各パッケージに同様のインフラコードが分散することを防げる。
  - RepositoryとMapperを分離することで、永続化モデルとアプリケーション側のデータモデルを独立して扱える。
  - 外部データを境界で検証することで、内部の処理へ不正または想定外のデータが入り込むことを防げる。
  - 共通のエラー処理へ変換することで、異なるインフラストラクチャ実装でも一貫したエラー処理を行える。

usage:
  - situation: ファイルを読み書きしたい
    guidance: gyomu-infraが提供するファイル操作機能を利用し、各パッケージで個別にファイルシステム処理を実装しない。

  - situation: ファイルを検索したい
    guidance: 提供されるファイル検索機能を利用し、検索処理の共通化と一貫したエラー処理を行う。

  - situation: CSVなどの外部データを扱いたい
    guidance: CSVやデータ変換の機能を利用し、必要に応じてSchemaによる検証と組み合わせて処理する。

  - situation: データベースへアクセスしたい
    guidance: Repositoryを利用し、データベース固有の実装を利用側から分離する。

  - situation: データベースのデータをアプリケーションのモデルへ変換したい
    guidance: Mapperを利用して永続化モデルとアプリケーション側のモデルを変換する。

  - situation: データベース操作のまとまりを管理したい
    guidance: Transactionの機能を利用してトランザクション境界を明確にする。

  - situation: 外部設定を読み込みたい
    guidance: 設定読み込み機能を利用し、環境依存の設定取得処理を各パッケージへ分散させない。

examples:
  - title: ファイル読み込み
    input: |
      設定ファイルやデータファイルを読み込みたい。
    output: |
      gyomu-infraのファイル操作機能を利用してファイル内容を取得する。
    explanation: |
      ファイルシステムへのアクセス処理とエラー処理を共通化できるため、
      利用側は具体的なファイル操作の実装詳細を意識せずに済む。

  - title: CSVデータの処理
    input: |
      外部から取得したCSVデータをアプリケーションで利用したい。
    output: |
      CSV機能を利用してデータを読み込み、必要に応じてSchemaによる検証を行う。
    explanation: |
      外部データの読み込みと内部データとして扱う前の検証を明確な境界で行える。

  - title: データベース操作
    input: |
      データベースからデータを取得したい。
    output: |
      Repositoryを利用してデータを取得し、必要に応じてMapperでアプリケーション側のモデルへ変換する。
    explanation: |
      データベース固有の実装をRepositoryの内側に閉じ込め、利用側との依存関係を整理できる。

  - title: トランザクション処理
    input: |
      複数のデータベース操作を一つのトランザクションとして実行したい。
    output: |
      Transaction機能を利用してトランザクション境界を管理する。
    explanation: |
      データベース操作の実装とトランザクション管理を分離し、処理単位を明確にできる。
