# yaml-language-server: $schema=../../../../schemas/Package.json

display_name: Gyomu Schema

mission: |
  Gyomu プロジェクト全体で共有されるスキーマ、型定義、エラー型、
  Protocol、および汎用ユーティリティを提供する。
  Python Analysis、Concept、Document、Knowledge、Snapshotなど、
  Gyomu の各機能間で受け渡されるデータの契約を定義し、
  パッケージ間の依存関係を疎結合に保ちながら、
  型安全性とデータの一貫性を維持することを目的とする。

policies:
  - Gyomu の複数パッケージで共有されるデータ契約は、原則として本パッケージに定義する。
  - JSON、永続化、MCPなどの外部境界で扱うデータは、原則としてPydantic Schemaとして定義する。
  - 内部処理でのみ使用する実装詳細なデータ構造は、Pydantic Schemaとして公開する必要がない。
  - ID、パス、その他の意味を持つ値は、可能な限り意味を型として表現し、値の取り違えを防止する。
  - Protocolは、実装と分離すべきインターフェース契約として定義する。
  - gyomu-schema には、複数パッケージが共有する必要があり、特定のパッケージの責務に属さないインターフェース契約を定義する。
  - 特定のパッケージの責務やユースケースに属するProtocolは、原則としてそのパッケージに定義する。
  - Protocolの定義と具体的な実装は、依存方向と責務に応じて適切なパッケージに配置する。
  - エラー型は共通のエラー構造に従い、パッケージ間で一貫したエラー処理ができるようにする。
  - Pydantic SchemaのAnnotationは、ランタイムでの型情報だけでなく、AIによるコード生成、ドキュメント生成、Knowledge生成にも利用されるため、可能な限り省略しない。
  - ユーティリティは特定のGyomuパッケージのビジネスロジックを持たず、汎用的な処理として実装する。
  - APIは可能な限りイミュータブルかつ宣言的に設計する。
  - 本パッケージはGyomuの他パッケージに依存せず、共有基盤として利用できる状態を維持する。

constraints:
  - Pydantic、Returns、Python標準ライブラリ以外の外部ライブラリへ依存してはならない。
  - gyomu 配下の他パッケージへ依存してはならない。
  - Gyomu固有のビジネスロジックを実装してはならない。
  - 特定のアプリケーションやパッケージに固有の処理を配置してはならない。
  - インフラストラクチャ固有の実装を提供してはならない。
  - AIモデルの実行やLLM固有の処理を実装してはならない。

non_goals:
  - 他パッケージで利用される具体的なサービス実装を提供すること。
  - ファイルシステム、データベース、外部サービスなどのインフラストラクチャ実装を提供すること。
  - AIモデルの実行やプロンプト生成を行うこと。
  - アプリケーション固有の業務ロジックを実装すること。
  - 特定のパッケージだけが必要とする専用の型やユーティリティを配置すること。

terminology:
  - term: Pydantic Schema
    definition: |
      Pydantic BaseModelを利用して定義されたデータモデル。
      ランタイムでの入力検証、シリアライズ、デシリアライズ、
      および型情報の提供に利用する。

  - term: ブランド型
    definition: |
      実行時には同じ基底型で表現される値であっても、
      型として異なる意味を持つことを明示し、値の取り違えを防止するための型。

  - term: Protocol
    definition: |
      具体的な実装を持たず、共有するインターフェースの契約だけを定義するPythonの型。

  - term: ユーティリティ
    definition: |
      特定のGyomuパッケージのビジネスロジックに依存せず、
      複数の場所から再利用できる汎用的な補助機能。

rationale:
  - 共有スキーマを一元管理することで、パッケージ間で受け渡されるデータ契約を統一できる。
  - Pydantic Schemaを外部境界の契約として利用することで、データの検証とシリアライズを一貫して行える。
  - 意味の異なる値を型として区別することで、識別子やパスなどの取り違えを防止できる。
  - Protocolと実装を分離することで、具象実装への依存を避け、依存方向を制御できる。
  - インターフェース契約の責務に応じて配置先を選ぶことで、共通パッケージへの過度な集約を防ぎ、パッケージ間の結合を最小限にできる。
  - Gyomuの他パッケージへ依存しないことで、各パッケージから共通して利用できる基盤を維持できる。

usage:
  - situation: 複数パッケージで利用するデータモデルを作成する
    guidance: |
      パッケージ間で受け渡されるデータ契約であれば、
      Pydantic Schemaとしてgyomu-schemaに定義する。

  - situation: JSONや永続化データの構造を定義する
    guidance: |
      Pydantic Schemaとしてgyomu-schemaに定義し、
      入力検証とシリアライズ・デシリアライズに利用する。

  - situation: IDやパスなど意味を持つ値を定義する
    guidance: |
      単純なstringやPathを直接共有するのではなく、
      可能な限り意味を区別できる型として定義する。

  - situation: 複数パッケージから利用するインターフェースを定義する
    guidance: |
      まず、そのインターフェースがパッケージ横断的な共通契約なのか、特定のパッケージの責務に属する契約なのかを判断する。
      パッケージ横断的な共通契約であればgyomu-schemaに定義し、それ以外は原則として責務を持つパッケージに定義する。
      具体的な実装は、依存方向と実装責務に応じた別の場所に配置する。

  - situation: 共通のエラー型を追加する
    guidance: |
      既存の共通エラー構造に従ってエラー型を定義し、
      パッケージ間で一貫したエラー処理ができるようにする。

  - situation: 共通関数を追加する
    guidance: |
      特定のGyomuパッケージのビジネスロジックに依存しない、
      汎用的な処理のみをgyomu-schemaに追加する。

examples:
  - title: 共有スキーマ
    input: |
      PackageConceptをAI CompilerとDocumentation Generatorの両方で利用する。
    output: |
      PackageConceptをPydantic Schemaとしてgyomu-schemaに定義する。
    explanation: |
      複数パッケージで利用されるデータ契約を一元管理することで、
      パッケージ間のデータ構造を統一する。

  - title: サービス契約
    input: |
      複数パッケージから利用するインターフェースを定義したい。
    output: |
      Protocolとしてインターフェース契約をgyomu-schemaに定義し、
      具体的な実装は別パッケージに配置する。
    explanation: |
      契約と実装を分離することで、共有パッケージから具体的な実装への依存を防止する。

  - title: ブランド型
    input: |
      ProjectRelativePathとFullPathはどちらもPathで表現される。
    output: |
      それぞれを意味の異なる型として定義する。
    explanation: |
      実行時の表現が同じ値であっても型として区別することで、
      誤った値の受け渡しを防止する。

  - title: エラー型
    input: |
      PackageConceptの読み込み時に発生するエラーを定義したい。
    output: |
      共通のエラー構造に従ったPackageConceptErrorを定義する。
    explanation: |
      エラー型の構造を統一することで、各パッケージで一貫したエラー処理を実現する。
