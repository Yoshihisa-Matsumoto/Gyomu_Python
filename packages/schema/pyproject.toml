[project]
name = "gyomu-schema"
dynamic = ["version"]
description = "Gyomu canonical schemas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic",
    "returns",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../version/__about__.py"
