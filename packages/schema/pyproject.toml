[project]
name = "gyomu-schema"
dynamic = ["version"]
description = "Gyomu canonical schemas"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2,<3",
    "returns>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../version/__about__.py"
