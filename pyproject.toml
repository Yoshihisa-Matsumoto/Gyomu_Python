[project]
name = "gyomu-python"
version = "0.1.0"
description = "Enterprise operational framework"
requires-python = ">=3.14"
authors = [
    { name = "Yoshihisa Matsumoto", email = "yoshmatsumoto@gmail.com" }
]
readme = "README.md"
dependencies = [
    "returns>=0.29.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9,<10",
    "ruff>=0.16.3",
]

[tool.uv.workspace]
members = [
    "packages/schema",
    "packages/infra",
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["returns.contrib.mypy.returns_plugin"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external infrastructure",
]
