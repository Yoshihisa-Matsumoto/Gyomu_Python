

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "mypy>=2.3.1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.uv.workspace]
members = [
    "packages/schema",
    "packages/infra",
    "packages/ai",
    "packages/python-analysis"
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["returns.contrib.mypy.returns_plugin"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    "packages/infra/src/gyomu_infra/db/model/generated",
    "version",
    "docs"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external infrastructure",
]
testpaths = [
    "packages",
]

[tool.coverage.run]
source_pkgs = [
    "gyomu_schema",
    "gyomu_infra",
    "gyomu_ai"
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
