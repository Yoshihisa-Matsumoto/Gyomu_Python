

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "mypy>=2.3.1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
]
[tool.uv]
constraint-dependencies = [
    "returns>=0.29.0,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.3,<2",
]

[tool.uv.workspace]
members = [
    "packages/schema",
    "packages/infra",
    "packages/ai",
    "packages/python_analysis",
    "packages/ai_compiler",
    "packages/docstring",
    "packages/workflow",
    "apps/cli",
]



[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["returns.contrib.mypy.returns_plugin"]
files = [
    "packages/schema/src",
    "packages/infra/src",
    "packages/ai/src",
    "packages/python_analysis/src",
    "packages/docstring/src",
    "packages/ai_compiler/src",
    "apps/cli/src"
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    "packages/infra/src/gyomu_infra/db/model/generated",
    "packages/python_analysis/python_analysis_test_support/fixtures",
    "packages/python_analysis/experiments",
    "version",
    "docs"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external infrastructure",
    "package: tests requiring independent venv while installing built packages"
]
testpaths = [
    "packages","apps"
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = [
    "packages/python_analysis",
    "packages/docstring",
    "packages/ai_compiler",
]

[tool.coverage.run]
source_pkgs = [
    "gyomu_schema",
    "gyomu_infra",
    "gyomu_ai",
    "gyomu_python_analysis",
    "gyomu_docstring",
    "gyomu_ai_compiler"
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
