[project]
name = "gyomu-python"
version = "0.1.0"
description = "Enterprise operational framework"
requires-python = ">=3.14"
authors = [
    { name = "Yoshihisa Matsumoto", email = "yoshmatsumoto@gmail.com" }
]
readme = "README.md"
dependencies = [
    "returns>=0.29.0",
]

[tool.uv.workspace]
members = [
    "packages/schema",
    "packages/infra",
]

[tool.mypy]
python_version = "3.14"
plugins = ["returns.contrib.mypy.returns_plugin"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9,<10",
]
