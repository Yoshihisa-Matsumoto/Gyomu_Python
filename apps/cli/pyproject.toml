[project]
name = "gyomu-cli"
dynamic = ["version"]
description = "Gyomu CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gyomu-schema",
    "gyomu-infra",
    "returns",
    "gyomu-workflow",
    "typer>=0.27.2",
]
license = "MIT"
authors = [
    { name = "Yoshihisa Matsumoto" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Yoshihisa-Matsumoto/Gyomu_Python"
Repository = "https://github.com/Yoshihisa-Matsumoto/Gyomu_Python"
Issues = "https://github.com/Yoshihisa-Matsumoto/Gyomu_Python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
gyomu-schema = { workspace = true }
gyomu-infra = { workspace = true }
gyomu-workflow = { workspace = true }

[tool.hatch.version]
path = "../../version/__about__.py"

[project.scripts]
gyomu = "gyomu_cli.main:app"
