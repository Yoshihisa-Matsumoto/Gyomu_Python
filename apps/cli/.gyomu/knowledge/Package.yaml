# yaml-language-server: $schema=../../../../schemas/Package.json

display_name: Gyomu CLI

mission: |
  Gyomuの機能をコマンドラインから利用するための実行インターフェースを提供します。
  ユーザーからのコマンド、引数、オプションを受け取り、対応する処理に必要な
  入力情報を構築して、Workflowなどのアプリケーション機能を呼び出します。
  コマンドライン固有の入力処理とアプリケーションの処理ロジックを分離することで、
  Gyomuの機能を一貫したインターフェースから利用できるようにします。

responsibilities:
  - Gyomuの機能を実行するためのコマンド、サブコマンド、引数、オプションを提供する
  - コマンドライン入力を解析し、各処理に必要な実行オプションやリクエストを構築する
  - 対象プロジェクトやワークスペースなど、実行対象を指定するための入力を受け付ける
  - 入力値や実行オプションの妥当性を確認し、不正な入力を適切に扱う
  - Workflowなどのアプリケーション機能を呼び出し、処理結果を受け取る
  - 実行結果やエラーをコマンドライン利用者に分かりやすく提示する
  - 終了ステータスなど、コマンドライン実行に必要な結果を管理する
  - CLIの起動時に必要な依存関係を構築し、各処理へ注入する

policies:
  - CLIはコマンドライン入力の受付、解釈、実行要求の構築、結果の表示を担当し、個々のアプリケーション処理の実装を担当しない
  - コマンド、引数、オプションは利用者が理解しやすく、一貫した命名と動作を持つように設計する
  - 入力値の検証はCLIの入力境界で行い、各処理が必要とする型安全な入力を構築する
  - 実行対象や実行オプションを明示的に扱い、暗黙の設定や予測困難な動作を避ける
  - Workflowなどの処理は定義された公開インターフェースを通じて呼び出し、内部実装へ直接依存しない
  - 処理順序や再実行条件などのワークフロー制御をCLI自身に実装せず、担当するパッケージへ委譲する
  - AIモデルの選択、実行、Retry、Routingなどの詳細をCLI自身に実装しない
  - Composition Rootとして依存関係を構築し、必要な依存をコンストラクタインジェクションなどで受け渡す
  - 処理結果とエラーを適切に区別し、利用者に必要な情報を提示するとともに適切な終了ステータスを返す
  - CLIから独立したアプリケーション機能を維持し、CLI固有の都合を下位パッケージへ持ち込まない

constraints:
  - コマンドラインの入力と出力を担当するが、各機能のドメインロジックを実装しない
  - Pythonソースコードの解析やSnapshotの生成・比較をCLI自身で実装しない
  - Directory Concept、Package Concept、README、LLM Contextなどの生成ロジックを実装しない
  - docstringの解析・生成・更新・適用ロジックを実装しない
  - Workflowの処理順序、Checkpoint、再開条件などの制御ロジックを重複して実装しない
  - AIプロバイダーやLLMのAPIをCLIから直接呼び出さない
  - AI実行、Routing、Fallback、Retryなどの内部実装に依存しない
  - 下位パッケージの内部実装ではなく、公開されたインターフェースを通じて処理を呼び出す
  - CLI固有の引数解析や表示形式を下位パッケージの責務にしない
  - CLIの実行状態を、必要性が明確でない限り独自の永続化機構で管理しない
  - 特定のシェル、ターミナル、IDEなどの実行環境に不必要に依存しない
  - コマンドの実行結果やエラーを曖昧に扱わず、成功・失敗を呼び出し元から判別できるようにする

non_goals:
  - Pythonソースコードの構造解析、型情報の抽出、依存関係分析を実装しない
  - SnapshotやChange Detectionの生成・比較・永続化を実装しない
  - Directory ConceptやPackage Conceptの生成ロジックを実装しない
  - READMEやLLM Contextなどのドキュメント生成ロジックを実装しない
  - docstringの解析、生成、更新、適用を実装しない
  - AIモデルの呼び出し、プロンプト生成、Routing、Fallback、Retryを実装しない
  - Workflowの実行順序、Checkpoint、再開条件などを管理しない
  - 下位パッケージの処理をCLI向けに複製して実装しない
  - CLI以外の利用形態に対応するための実行インターフェースを提供しない
  - アプリケーション機能そのものをCLIに依存させない
  - 利用者の入力や実行結果を独自の業務データとして永続化する機能を提供しない

terminology:
  - term: CLI
    definition: Gyomuの機能をコマンドラインから利用するための実行インターフェース。

  - term: Command
    definition: CLIで実行する処理を識別する単位。サブコマンドや引数などによって実行内容を指定する。

  - term: Argument
    definition: コマンドの実行対象や処理内容などを指定するために、コマンドラインから渡される入力値。

  - term: Option
    definition: コマンドの実行方法や動作を指定するための入力。フラグや名前付きパラメーターなどを含む。

  - term: Execution Request
    definition: コマンドライン入力を解析し、アプリケーション処理を実行するために構築された要求や実行設定。

  - term: Composition Root
    definition: CLIの起動時に必要な依存関係を構築し、各コンポーネントへ受け渡す場所。

  - term: Exit Status
    definition: CLIの実行結果をプロセスの終了コードとして表現したもの。成功や失敗をシェルなどの呼び出し元へ伝える。

  - term: User-facing Output
    definition: CLIの利用者が処理結果、進行状況、警告、エラーなどを理解するために表示される情報。

rationale:
  - CLIをアプリケーション機能の実装から分離することで、コマンドライン固有の変更が下位パッケージへ波及することを防げる。
  - コマンドライン入力を型安全な実行要求に変換することで、入力境界での検証とアプリケーション処理の責務を明確にできる。
  - Workflowなどの公開インターフェースを通じて処理を呼び出すことで、実行制御や個々の処理の実装をCLIから独立して維持できる。
  - Composition Rootで依存関係を構築することで、各コンポーネントの責務と依存関係を明確にできる。
  - 処理結果とエラーを適切な終了ステータスや表示に変換することで、対話的な利用だけでなく、シェルスクリプトや自動化処理からもCLIを利用しやすくなる。
  - CLIとアプリケーション機能を分離することで、将来MCPなど別の実行インターフェースを追加しても、既存の処理ロジックを再利用できる。

usage:
  - situation: Gyomuの機能をコマンドラインから実行したい
    guidance: 対応するCommandを定義し、入力値を解析して必要なExecution Requestを構築し、担当するアプリケーション機能を呼び出す。

  - situation: 対象プロジェクトやワークスペースを指定して処理を実行したい
    guidance: ArgumentやOptionで実行対象を受け付け、必要な検証を行ったうえで処理に渡す。

  - situation: READMEやLLM Contextなどを生成したい
    guidance: CLIで必要な実行オプションを受け付け、Workflowなどの公開インターフェースを通じて生成処理を実行する。

  - situation: CLIに不正な引数やオプションが渡された
    guidance: 入力境界で不正な入力を検出し、修正方法を理解できるエラーメッセージと適切な終了ステータスを返す。

  - situation: アプリケーション処理が失敗した
    guidance: 返されたエラーを適切に扱い、利用者に必要な情報を提示して失敗を終了ステータスに反映する。

  - situation: CLIの依存関係を変更したい
    guidance: Composition Rootで依存関係を構築し、各処理の公開インターフェースを通じて必要な依存を受け渡す。

  - situation: CLI以外から同じアプリケーション処理を利用したい
    guidance: CLI固有の入力解析や表示処理をアプリケーション機能から分離し、下位パッケージの公開インターフェースを再利用する。

examples:
  - title: README生成
    input: |
      対象プロジェクトを指定してREADMEを生成したい。
    output: |
      CLIが対象プロジェクトと実行オプションを解析し、対応するWorkflowを呼び出す。
      Workflowの実行結果に応じて、CLIが結果やエラーを表示する。
    explanation: |
      CLIは入力の受付と結果の提示に専念し、README生成の実装と実行制御は
      担当する下位パッケージへ委譲する。

  - title: 実行オプションの指定
    input: |
      特定の処理だけを有効にしてGyomuを実行したい。
    output: |
      CLIが指定されたオプションを解析・検証し、対応する実行要求を構築して処理へ渡す。
    explanation: |
      入力の解釈と実際の処理を分離することで、コマンドラインの仕様変更が
      アプリケーションロジックへ直接影響することを防ぐ。

  - title: 処理失敗の通知
    input: |
      Workflowの実行中にエラーが発生した。
    output: |
      CLIがエラーを受け取り、利用者に必要な情報を表示して、失敗を示す終了ステータスを返す。
    explanation: |
      アプリケーション処理のエラーとCLIでの表示・終了コードへの変換を分離することで、
      自動化処理からも結果を判別できる。

  - title: 自動化スクリプトからの利用
    input: |
      シェルスクリプトからGyomuを実行し、成功・失敗に応じて後続処理を分岐したい。
    output: |
      CLIが処理結果に対応する終了ステータスを返し、呼び出し元がその値に基づいて分岐する。
    explanation: |
      終了ステータスを一貫して扱うことで、対話的な利用だけでなく、
      CIやローカル自動化処理からもCLIを利用しやすくなる。
