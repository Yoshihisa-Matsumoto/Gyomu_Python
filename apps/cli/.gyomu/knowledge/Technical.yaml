# yaml-language-server: $schema=../../../../schemas/Technical.json

installation:
  - command: uv add gyomu-cli
    description: |
      通常のPythonパッケージと同様にインストールする。
      特別なセットアップは不要。

configuration: []

dependencies:
  - package: pydantic
    description: |
      Pydantic Schemaの定義、データの検証、
      シリアライズ・デシリアライズなどに利用する。

  - package: gyomu-schema
    description: |
      スキーマ、共通型の置き場として利用

  - package: gyomu-infra
    description: |
      I/Oなどの基盤処理全般に利用

  - package: gyomu-ai
    description: |
      LLMの初期化、特にルーティングテーブル構築に使う

  - package: gyomu-ai-compiler
    description: |
      ルーティングテーブルIDの取得に使う

  - package: gyomu-workflow
    description: |
      一連のSnapshot関連のタスクが実装されている

compatibility: []

migration: []
